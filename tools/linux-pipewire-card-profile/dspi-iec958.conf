# Local PipeWire ALSA card profile for RYNLABS DSPi.
#
# DSPi is a USB Audio Class device whose physical output is S/PDIF, but the
# generic ACP profile exposes both front:%f ("Analog Stereo") and iec958:%f
# ("Digital Stereo").  This profile keeps only the IEC958 output mapping and
# points it at a DSPi-specific mixer path that uses the USB Audio PCM hardware
# volume control.

[General]
auto-profiles = yes

[Mapping iec958-stereo]
description = Digital Stereo (IEC958)
device-strings = iec958:%f
channel-map = left,right
paths-output = dspi-iec958-output
priority = 15
direction = output
